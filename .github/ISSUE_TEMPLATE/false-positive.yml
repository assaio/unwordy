name: False positive
description: A useful message was flagged by a local rule.
title: 'False positive: '
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: H4a
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Redacted text and reason it should stay
      description: Remove private names, addresses, tokens and links.
    validations:
      required: true
  - type: textarea
    id: profile
    attributes:
      label: Redacted profile settings
  - type: input
    id: version
    attributes:
      label: Unwordy version and host version
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Route
      options: [Local checker, Claude Code, Codex, Cursor, Standalone skill]
